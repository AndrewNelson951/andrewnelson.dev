<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>andrewnelson.dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --red: #e8552d;
    --gray: #6b7280;
    --blue: #2563eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 480px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.4rem;
  }
  .sub {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 2.25rem;
  }
  .links { display: flex; flex-direction: column; gap: 0.75rem; }
  a.tool {
    display: flex;
    align-items: baseline;
    gap: 0.9rem;
    text-decoration: none;
    color: var(--ink);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    padding: 1rem 1.1rem;
    transition: background 0.12s ease, transform 0.12s ease, border-color 0.12s ease;
  }
  a.tool:hover { background: #fafafa; transform: translateX(2px); border-color: var(--accent); }
  a.tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a.tool .idx {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 600;
    min-width: 1.5rem;
  }
  a.tool .meta { display: flex; flex-direction: column; gap: 0.15rem; }
  a.tool .name { font-weight: 600; font-size: 1.05rem; }
  a.tool .desc {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.01em;
  }
  .bodycomp { --accent: var(--red); }
  .diet { --accent: var(--gray); }
  .workout { --accent: var(--blue); }
  .momentum { --accent: #0f766e; }
  footer {
    margin-top: 2.25rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }
  @media (prefers-reduced-motion: reduce) {
    a.tool { transition: none; }
    a.tool:hover { transform: none; }
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">andrewnelson.dev</p>
    <h1>Andrew Nelson</h1>
    <p class="sub">Personal tools.</p>
    <nav class="links">
      <a class="tool bodycomp" href="https://bodycomp.andrewnelson.dev/">
        <span class="idx">01</span>
        <span class="meta">
          <span class="name">Body Composition</span>
          <span class="desc">daily logging &middot; (private)</span>
        </span>
      </a>
      <a class="tool diet" href="https://visceral-meal-plan.andrewnelson.dev/index.html">
        <span class="idx">02</span>
        <span class="meta">
          <span class="name">Meal Plan</span>
          <span class="desc">carb cycling &middot; high / low / moderate</span>
        </span>
      </a>
      <a class="tool workout" href="https://weekly-workout.andrewnelson.dev/index.html">
        <span class="idx">03</span>
        <span class="meta">
          <span class="name">Workout Schedule </span>
          <span class="desc">full body &middot; mon / wed / fri</span>
        </span>
      </a>
      <a class="tool momentum" href="https://momentum-log.andrewnelson.dev/index.html">
        <span class="idx">04</span>
        <span class="meta">
          <span class="name">Momentum Log</span>
          <span class="desc">daily progress and energy tracking (private)</span>
        </span>
      </a>
    </nav>
    <footer>&copy; <span id="yr"></span> &mdash; andrewnelson.dev</footer>
  </main>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
